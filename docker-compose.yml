services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navasena_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-navasena_keuangan}
      - DB_USER=${DB_USER:-navasena_user}
      - DB_PASS=${DB_PASS:-navasena_secure_password_2026}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - navasena_net

  db:
    image: mariadb:10.11
    container_name: navasena_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-root_navasena_secret_2026}
      - MYSQL_DATABASE=${DB_NAME:-navasena_keuangan}
      - MYSQL_USER=${DB_USER:-navasena_user}
      - MYSQL_PASSWORD=${DB_PASS:-navasena_secure_password_2026}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - navasena_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  storage_data:

networks:
  navasena_net:
    driver: bridge
